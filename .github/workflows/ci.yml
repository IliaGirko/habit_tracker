name: Django CI

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -

      - name: Configure Poetry to create virtualenvs in the project directory
        run: |
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: |
          poetry install --no-root

      - name: Run flake8
        run: |
          poetry run flake8 .


  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -

      - name: Configure Poetry to create virtualenvs in the project directory
        run: |
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: |
          poetry install --no-root   

      - name: Run tests
        run: |
          poetry run python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/habit_tracker:latest -f Dockerfile .

      - name: Log in Docker hub
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Push Docker image in Docker hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/habit_tracker:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      SSH_KEY: ${{ secrets.SSH_KEY }}
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SERVER_IP: ${{ secrets.SERVER_IP }}

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}  << 'E0F0'
          cd habit_tracker
          printf "DEBUG=%s\n" "${{ secrets.DEBUG }}" > .env
          printf "POSTGRES_DB=%s\n" "${{ secrets.POSTGRES_DB }}" >> .env
          printf "POSTGRES_USER=%s\n" "${{ secrets.POSTGRES_USER }}" >> .env
          printf "POSTGRES_PASSWORD=%s\n" "${{ secrets.POSTGRES_PASSWORD }}" >> .env
          printf "POSTGRES_HOST=%s\n" "${{ secrets.POSTGRES_HOST }}" >> .env
          printf "POSTGRES_PORT=%s\n" "${{ secrets.POSTGRES_PORT }}" >> .env
          printf "TOKEN_TG_BOT=%s\n" "${{ secrets.TOKEN_TG_BOT }}" >> .env
          printf "EMAIL_HOST=%s\n" "${{ secrets.EMAIL_HOST }}" >> .env
          printf "EMAIL_PORT=%s\n" "${{ secrets.EMAIL_PORT }}" >> .env
          printf "EMAIL_USE_TLS=%s\n" "${{ secrets.EMAIL_USE_TLS }}" >> .env
          printf "EMAIL_USE_SSL=%s\n" "${{ secrets.EMAIL_USE_SSL }}" >> .env
          printf "EMAIL_HOST_USER=%s\n" "${{ secrets.EMAIL_HOST_USER }}" >> .env
          printf "EMAIL_HOST_PASSWORD=%s\n" "${{ secrets.EMAIL_HOST_PASSWORD }}" >> .env
          sudo git pull
          sudo docker stop habit_tracker || true
          sudo docker rm -f habit_tracker || true
          sudo docker compose down -v
          sudo docker compose up -d --build
          E0F0
